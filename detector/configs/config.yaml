# ============================================================================
# RSNA Liver Injury Detection - V-DETR + SSL Configuration
# ============================================================================
# Dataset: 98 labeled liver files + 2000 unlabeled SSL files
# Volume: 512×336×336 voxels, Spacing: 2.0×1.0×1.0 mm (anisotropic)
# Model: V-DETR with 3D UNet encoder (SSL pre-trained)
# ============================================================================

# ============================================================================
# DATASET CONFIGURATION
# ============================================================================
dataset:
  data_dir: "../preprocessed_data"
  dataset_num_workers: 4
  batchsize_per_gpu: 2

# ============================================================================
# UNET ENCODER (SSL PRE-TRAINED)
# ============================================================================
unet:
  unet_checkpoint: "../unet_liver_encoder_ckpt/3D_unet_liver_ssl_weights.pth"
  unet_channels: 256
  unet_resolution: [32, 21, 21]
  max_voxels: 4096
  freeze_unet: true
  unfreeze_after_epoch: 20
  unfreeze_warmup_epochs: 3

# ============================================================================
# TRANSFORMER ARCHITECTURE
# ============================================================================
encoder:
  enc_dim: 256

decoder:
  dec_dim: 256
  dec_nlayers: 9
  dec_ffn_dim: 1024
  dec_dropout: 0.1
  dec_nhead: 4
  dec_norm: "ln"

# Relative Position Encoding (8-corner RPE - V-DETR's innovation)
rpe:
  rpe_dim: 128
  rpe_quant: "bilinear_4_10"
  log_scale: 512.0
  angle_type: ""

# ============================================================================
# OBJECT QUERIES
# ============================================================================
queries:
  nqueries: 256
  querypos_mlp: false
  q_content: "sample"
  pos_for_key: false
  share_selfattn: false

# ============================================================================
# MLP PREDICTION HEADS
# ============================================================================
heads:
  mlp_dropout: 0.3
  mlp_norm: "bn1d"
  mlp_act: "relu"
  mlp_sep: true
  is_bilable: true

# ============================================================================
# LOSS FUNCTIONS
# ============================================================================
loss:
  cls_loss: "focalloss_0.25"
  loss_sem_cls_weight: 3.0
  loss_center_weight: 5.0
  loss_size_weight: 1.0
  loss_giou_weight: 2.0

# Hungarian Matcher Costs
matcher:
  matcher_cls_cost: 2.0
  matcher_center_cost: 5.0
  matcher_size_cost: 1.0
  matcher_giou_cost: 2.0

# ============================================================================
# OPTIMIZER
# ============================================================================
optimizer:
  base_lr: 0.0001
  encoder_lr: 0.00001
  weight_decay: 0.0001
  lr_scheduler: "cosine"
  warm_lr_epochs: 5
  clip_gradient: 0.1
  filter_biases_wd: true

# ============================================================================
# TRAINING SCHEDULE
# ============================================================================
training:
  max_epoch: 100
  start_epoch: 0
  seed: 0
  eval_every_epoch: 5

# ============================================================================
# EVALUATION METRICS
# ============================================================================
evaluation:
  ap_iou_thresholds: [0.10, 0.25, 0.5, 0.75]
  conf_thresh: 0.05
  nms_iou: 0.25
  use_nms: true

# ============================================================================
# SEMI-SUPERVISED LEARNING (MEAN-TEACHER)
# ============================================================================
ssl:
  ssl_enabled: true
  ssl_unlabeled_data_dir: "../preprocessed_ssl"
  ssl_unlabeled_batch_size: 2
  
  # SSL Schedule: starts at epoch 20 (when UNet unfreezes)
  ssl_start_epoch: 20
  ssl_consistency_warmup_epochs: 40  # Ramps 0 → 0.3 from epoch 20 to 60
  ssl_consistency_max_weight: 0.3    # Peak SSL contribution (30%)
  
  # SSL Loss Weights
  ssl_consistency_center_weight: 1.0
  ssl_consistency_size_weight: 1.0
  ssl_consistency_cls_weight: 1.0
  ssl_temperature: 2.0

# ============================================================================
# HARDWARE
# ============================================================================
hardware:
  ngpus: 1
  dist_url: "tcp://localhost:12345"

# ============================================================================
# LOGGING & CHECKPOINTING
# ============================================================================
logging:
  checkpoint_dir: "checkpoints"
  log_every: 10
  save_separate_checkpoint_every_epoch: 10
  
  # Weights & Biases (disabled)
  wandb_activate: false
  wandb_entity: null
  wandb_project: "rsna-vdetr"
  wandb_key: ""
